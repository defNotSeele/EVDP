name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dashboard/web/dist

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m compileall -q ingest dashboard/api
      - run: pip install flask==3.1.3
      - name: API smoke test against a fresh database
        working-directory: dashboard/api
        run: |
          sqlite3 "$RUNNER_TEMP/test.db" < ../../schema.sql
          EVDP_DB="$RUNNER_TEMP/test.db" python - <<'PY'
          from app import app
          client = app.test_client()
          for path in ("/api/entry", "/api/entry?range=7d", "/api/paths"):
              r = client.get(path)
              assert r.status_code == 200, (path, r.status_code)
          assert client.get("/api/entry?range=bogus").status_code == 400
          print("API OK")
          PY
